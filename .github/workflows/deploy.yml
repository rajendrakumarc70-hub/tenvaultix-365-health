name: Test and deploy to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# The workflow's own GitHub token can only read the code. Actions are pinned to exact commits, not tags that
# could be moved; Dependabot (.github/dependabot.yml) proposes updates.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:  # the suite runs a second time on PostgreSQL
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: tvx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Tests on SQLite
        run: python -m pytest -q
      - name: Tests on PostgreSQL
        run: python -m pytest -q
        env:
          TVX_TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/tvx_test
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  # Optional: only runs when the CLOUDFLARE_API_TOKEN secret is set. Without it, Cloudflare's own Git
  # integration (Workers Builds) builds and deploys on each push instead.
  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "No CLOUDFLARE_API_TOKEN secret, so Cloudflare Workers Builds handles deploys." >> "$GITHUB_STEP_SUMMARY"
      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: env.HAS_TOKEN == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - if: env.HAS_TOKEN == 'true'
        run: npm ci
      # Builds the Docker image, pushes it to Cloudflare and deploys the Worker in front of it.
      - name: Deploy Worker and container
        if: env.HAS_TOKEN == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --containers-rollout=immediate
      - name: Show the link
        if: env.HAS_TOKEN == 'true'
        run: echo "Live at ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
